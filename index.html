  <template id="doc-research">
    <p class="kicker">Final-year project · KCL × Oxford Dynamics · 2026–27</p>
    <h1>Liquid Neural Networks</h1>
    <p class="lead">Neural networks that keep adapting how fast they react, built for robots acting in the real world.</p>
    <h2>What they are</h2>
    <p>Most neural networks process the world in fixed time steps. Liquid neural networks are continuous-time models: every neuron is a small differential equation, and its time constant changes depending on the input it receives. A strong signal makes a neuron react quickly; a quiet one lets it integrate slowly.</p>
    <h2>Why they matter for robotics</h2>
    <ul>
      <li><strong>Continuous time.</strong> Real sensors stream data at irregular rates. A continuous-time model handles that naturally.</li>
      <li><strong>Compact.</strong> Richer dynamics per neuron means far fewer neurons than comparable deep models. In one well-known result, a circuit with 19 control neurons kept a car in its lane.</li>
      <li><strong>Interpretable.</strong> Small, sparse networks can actually be inspected, which matters when a robot is making decisions.</li>
    </ul>
    <h2>The project</h2>
    <p>I'm running this as an industry research project with Oxford Dynamics' research division, supervised by Dr. Shireen Kudukkil Manchingal.</p>
    <p class="note">In progress. Notes and results will be added to this folder as the project develops.</p>
