  <template id="doc-research">
    <p class="kicker">Final-year project · KCL × Oxford Dynamics · 2026–27</p>
    <h1>Liquid Neural Networks as adaptive filters</h1>
    <p class="lead">Do liquid networks learn to behave like a Kalman filter?</p>
    <h2>Liquid time-constant networks</h2>
    <p>Most neural networks process the world in fixed time steps. Liquid time-constant (LTC) networks are continuous-time models: every neuron is a small differential equation, and its time constant changes with the input it receives. A strong signal makes a neuron react quickly; a quiet one lets it integrate slowly.</p>
    <h2>The question</h2>
    <p>A Kalman filter is the classical, optimal way to estimate the state of a system from noisy measurements. Its key quantity, the Kalman gain, decides how much to trust each new measurement against the current estimate.</p>
    <p>An LTC neuron's input-dependent time constant plays a strikingly similar role: it decides how fast the neuron's state moves toward new input. My project investigates whether the time constants an LTC network learns actually correspond to the Kalman gain of an optimal linear filter, connecting continuous-time neural ODEs with classical state estimation.</p>
    <h2>Why it matters</h2>
    <ul>
      <li><strong>Interpretability.</strong> If learned time constants line up with Kalman gains, we can read what a network is doing in the language of control theory.</li>
      <li><strong>Robotics.</strong> State estimation sits at the heart of every autonomous system, from robot arms to vehicles.</li>
      <li><strong>Open.</strong> The work is built on open-source datasets so it can be published.</li>
    </ul>
    <h2>Setup</h2>
    <p>Run as my KCL final-year project under joint academic and industry supervision, with Oxford Dynamics' research division.</p>
    <p class="note">In progress. Notes and results will be added to this folder as the project develops.</p>
  </template>

  <template id="doc-arm">
    <p class="kicker">Projects / Arm Controller / README.md</p>
    <h1>Arm Controller</h1>
    <p class="lead">Drive a UR7e robot arm from the command line, with the controller I wrote in Python on ROS 2 and MoveIt during my internship at Oxford Dynamics. Here it runs in your browser and moves a simulated UR7e.</p>
    <p><button class="btn btn--primary" type="button" data-open="arm-app">Launch Controller</button></p>

    <h2>Quick start</h2>
    <ol>
      <li>Click <strong>Launch Controller</strong>. Two windows open: a terminal running <code>client.py</code>, and the arm.</li>
      <li>The command list prints straight away. Type at <code>Enter Command --&gt;</code> and press Enter.</li>
      <li>Try <code>move z 100</code> to lift the tool 10 cm, then <code>move x -150</code>, then <code>home</code> to go back.</li>
      <li>Then run the demo: type <code>pick_and_place</code> while the arm is at <code>home</code>.</li>
    </ol>

    <h2>Moving the arm</h2>
    <ul>
      <li><code>move x 100</code>, <code>move y -50</code>, <code>move z 80</code>: move the tool along an axis, in <strong>millimetres</strong>.</li>
      <li><code>move rx 30</code>, <code>move ry -20</code>, <code>move rz 45</code>: rotate the tool about its own axes, in <strong>degrees</strong>.</li>
    </ul>
    <p>Linear moves are measured from the robot's base unless you switch to the tool frame (see modes). In the base frame, <code>x</code> points forward from the robot, <code>y</code> to its left and <code>z</code> up.</p>

    <h2>Modes</h2>
    <p><code>mode</code> takes two letters. The line above every prompt tells you which mode you're in.</p>
    <ul>
      <li>First letter: <code>g</code> (global) measures moves in the base frame, <code>l</code> (local) in the tool's own frame.</li>
      <li>Second letter: <code>c</code> (Cartesian) moves the tool in a straight line, <code>j</code> (joint space) moves all six joints together to the same target, so the tool's path may curve.</li>
      <li>So <code>mode gc</code> is the default, and <code>mode lj</code> is local plus joint space.</li>
    </ul>
    <p>If a straight-line move can't be completed, for example because it would hit the table or pass through a singularity, the controller asks <code>Try via joint states instead? (y/n)</code>. Answer <code>y</code> to reach the same target with a joint-space move.</p>

    <h2>Waypoints and trajectories</h2>
    <ul>
      <li><code>save my_pose</code>: save where the arm is now as a waypoint. Saved waypoints stay in your browser.</li>
      <li><code>my_pose</code>: type a waypoint's name to move back to it. Built in: <code>home</code>, <code>pick_above</code>, <code>pick</code>, <code>place_above</code>, <code>place</code>.</li>
      <li><code>list_states</code>: list every waypoint.</li>
      <li><code>pick_and_place</code>: run a trajectory, a sequence of waypoints. A trajectory only starts if the arm is already at its first waypoint, so type <code>home</code> first if it refuses.</li>
      <li><code>list_trajectories</code>: list every trajectory.</li>
    </ul>

    <h2>Everything else</h2>
    <ul>
      <li><code>help</code> lists the commands, and <code>help move</code> shows one.</li>
      <li><code>q</code> quits the controller. Run <code>python3 client.py</code> at the shell prompt to start it again, or <code>exit</code> to close the terminal.</li>
      <li>If you mistype, you'll see <code>Invalid input/ Wrong input format</code> and <code>Would you like to try again? (y/n)</code>. Answer <code>y</code> to carry on.</li>
      <li>In the arm window, drag to orbit, scroll to zoom and double-click to reset the view. The blue line is the path the tool has travelled.</li>
    </ul>

    <h2>How the real one works</h2>
    <p>Two ROS 2 nodes. The client node reads commands, manages waypoints and reads the live <code>/joint_states</code> topic. The planner node holds the Cartesian and joint-space planners and executes the paths through MoveIt. Both run on a <code>MultiThreadedExecutor</code> in a background thread, so the blocking command prompt and live ROS communication can run at the same time.</p>
    <p class="note">In the browser there's no ROS. The terminal runs a line-by-line JavaScript port of <code>client.py</code>, a small IK solver and planner stand in for MoveIt, and the only collisions checked are with the table and the robot's base. The arm is the UR7e model from Universal Robots' ROS 2 description (BSD-3-Clause).</p>
  </template>

  <template id="doc-agent">
    <p class="kicker">Projects / Anmol Agent / README.md</p>
    <h1>anmol, my AI agent</h1>
    <p class="lead">An AI version of me that lives in this site's terminal. It answers questions about my work, my studies and this website in the first person, and it runs entirely on your own GPU.</p>
    <p><button class="btn btn--primary" type="button" data-open="agent-app">Launch Agent</button></p>

    <h2>Try it</h2>
    <ol>
      <li>Click <strong>Launch Agent</strong>, or type <code>agent</code> in any terminal on this site.</li>
      <li>The first time, pick a model. It downloads once and your browser caches it for next time. On a phone, pick <strong>lite mode</strong> (the default there).</li>
      <li>Ask anything at <code>you ›</code>, like what I'm working on, what's fun to try on the site, or how this agent works. Follow-ups like "tell me more" work too.</li>
      <li>When something on the site answers your question, it offers to open it: say "show me your CV" or "how do I contact you?", answer <code>yes</code>, and it opens on screen.</li>
      <li>Type <code>exit</code> or press Esc to leave. For a single question, use <code>ask &lt;question&gt;</code> instead.</li>
    </ol>

    <h2>What it knows</h2>
    <p>Only what's on this site: every document on the desktop, the site's README (features, things to try, terminal commands, how it was built) and my CV. It has no internet access and no memory between visits.</p>

    <h2>How it works</h2>
    <p>It's retrieval-augmented generation (RAG) running entirely in the browser:</p>
    <ol>
      <li><strong>Retrieval.</strong> The site's documents (split at their headings), the README's sections and my CV are indexed with BM25. Each message pulls in the few passages that match it best.</li>
      <li><strong>Generation.</strong> An open model runs in your browser with WebLLM on WebGPU. It gets those passages, today's date and the last two exchanges, answers as me in the first person, and the passages it used are listed underneath as sources.</li>
    </ol>

    <h2>Keeping it honest</h2>
    <ul>
      <li>It's told to use only facts from the passages, before and after your question, and to say when something isn't on my site rather than guess.</li>
      <li>If none of a question's real topics appear anywhere on the site (say, a skill I've never listed), it says so without asking the model at all. Greetings and words like "at the moment" don't count as topics, so friendly questions still get answered.</li>
      <li>Date ranges are written out in full and the model knows today's date, so it gets tenses right.</li>
      <li>Answers are short and low-temperature, and the model is told not to add feelings, plans or achievements that aren't on the site.</li>
    </ul>

    <h2>Choosing the models</h2>
    <p>I tested six open models through whole conversations full of trick questions. Four made up facts about me that aren't on this site, so they were dropped: Qwen2.5 0.5B, 1.5B and 3B, and Llama 3.2 1B. The two that stayed accurate are the ones you can pick: <strong>Llama 3.2 3B</strong> (1.8 GB, recommended) and <strong>Llama 3.1 8B</strong> (4.5 GB, the best answers on a strong GPU).</p>

    <h2>Privacy and limits</h2>
    <ul>
      <li>No server and no API key: your questions never leave your device. Only the model weights are downloaded, from Hugging Face.</li>
      <li>The AI models need a browser with WebGPU (recent Chrome, Edge or Safari) and a decent GPU. Phones don't give a browser tab enough memory for them: the tab gets closed and the page reloads. If that happens, the agent notices next time and suggests lite mode.</li>
      <li><strong>Lite mode</strong> needs no download and works everywhere. Instead of a model, it works out what kind of question you asked and replies with the most relevant lines from my site and CV, turned into first person. It can't make anything up, but it can't rephrase or reason either.</li>
      <li>It's a small model, so it can still make mistakes. Check the sources, or email me.</li>
    </ul>
    <p class="note">Built with WebLLM (Apache-2.0) and Meta's Llama models.</p>
  </template>
